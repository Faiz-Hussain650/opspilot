name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest

  docker:
    name: Build & scan ${{ matrix.image }} image
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [api, ui]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}.Dockerfile
          push: false
          load: true
          tags: opspilot-${{ matrix.image }}:ci
          # Skip baking the models in CI - it only slows the build down.
          build-args: PRELOAD_MODELS=false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Trivy runs from its official image, pinned to a known-good version.
      # (We deliberately avoid the mutable `trivy-action@<tag>` reference - in March
      #  2026 most of its tags were force-pushed to a credential stealer.)
      - name: Vulnerability scan (Trivy)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.69.3 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            --exit-code 0 \
            opspilot-${{ matrix.image }}:ci
