apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opspilot.fullname" . }}-config
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{- if ne $key "QDRANT_URL" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
  QDRANT_URL: {{ include "opspilot.qdrantUrl" . | quote }}
