{{- $name := printf "%s-ui" (include "opspilot.fullname" .) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "opspilot.selector" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opspilot.labels" . | nindent 8 }}
        {{- include "opspilot.selector" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          env:
            - name: UI_BACKEND
              value: api
            - name: API_URL
              value: "http://{{ include "opspilot.fullname" . }}-api:{{ .Values.api.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.ui.port }}
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "opspilot.selector" (dict "root" . "component" "ui") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ui.port }}
      targetPort: http
